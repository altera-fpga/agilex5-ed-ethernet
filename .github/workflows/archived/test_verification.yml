name: Test verification
on:
  workflow_dispatch:
  push:
    branches:
      - kamarthx/ragu_ethernet
  
  workflow_call:
    secrets:
        PSGPAC_SSH_KEY:
          required: true
    inputs:
      triggered_by_schedule:
        type: boolean
        required: false
        default: false
      triggered_by_tag_push:
        type: boolean
        required: false
        default: false
      release_tag:
        type: string
        required: false
        default: ""
  
jobs:
  regression_test:
    # runs-on: altera-innersource.prod.amr.dind
    # container: cache-registry.altera.com/cache/library/alpine:3.21
    runs-on: self-hosted
    env:
      SSH_HOST: psgpac@ascycron2.sc.altera.com
      COMMIT_SHA: /nfs/site/disks/pac_release_1/github/psgpac/util/build/commit_sha
      CODE_PATH: /nfs/site/disks/pac_release_1/github/psgpac/sed/tmp/applications.fpga.system-example-designs.test-automation  
      REPORT_PATH: /nfs/site/disks/pac_release_1/github/psgpac/sed/tmp/ethernet_report
      EXEC_SCRIPT_DIR: /nfs/site/disks/pac_release_1/github/psgpac/sed/tmp/applications.fpga.system-example-designs.test-automation/scripts/ethernet
        #REPORT_PATH: /nfs/site/disks/pac_release_1/github/psgpac/sed/build/ethernet/agilex5/sm72/modular/1x10G/latest/reports
        #EXEC_SCRIPT_DIR: /nfs/site/disks/pac_release_1/github/psgpac/sed/regression_test/tests/scripts/ethernet

    steps:
      # - name: Install packages
      #   run: |
      #     apk update
      #     apk add git openssh-client rsync

      # - name: Setup ssh
      #   run: |
      #     umask 077
      #     mkdir -p /root/.ssh
      #     echo '${{ secrets.PSGPAC_SSH_KEY }}' > /root/.ssh/id_ed25519
      #     echo '${{ env.SSH_HOST }} ${{ secrets.SSH_HOST_KEY }}' >> /root/.ssh/known_hosts
      #     echo ServerAliveInterval 30 >> /root/.ssh/config
      #     echo User psgpac >> /root/.ssh/config
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Trigger Regression test
        run: |
          ssh "$SSH_HOST" "cd ${{ env.CODE_PATH }} && git pull && cd ${{ env.EXEC_SCRIPT_DIR }} && \
          bash Top_execution.sh"

      - name: check csv 
        run: |
          ssh -t "$SSH_HOST" << 'EOF'
          cd ${{ env.REPORT_PATH }}
          if [ -f *.csv ];then
              echo "CSV File Generated"
              cat *.csv
          else
              echo "CSV File Not generated"
              exit 1
          fi
          EOF
