name: Synthesis Build and verification
on:
  workflow_dispatch:
  push:
    branches:
      - master
    # tags:
    #   - '*'
    # paths:
    #   - '.github/workflows/build-synth-verify.yml'
    #   - 'src/hw/**'
  pull_request:
    # branches:
    #   - master
    # tags:
    #   - '*'
    # paths:
    #   - '.github/workflows/build-synth-verify.yml'
    #   - 'src/hw/**'

  # schedule:
  #   - cron: '00 07 * * *'

jobs:
  build_synth:
    # runs-on: altera-innersource.prod.amr.dind
    # container: cache-registry.altera.com/cache/library/alpine:3.21
    runs-on: self-hosted
    outputs:
      changes_detected: ${{ steps.check_hw.outputs.run_hw }}
    env:
      SSH_HOST: psgpac@ascycron2.sc.altera.com
      WORKDIR: /nfs/site/disks/pac_release_1/github/psgpac/${{ github.repository }}/${{ github.run_id }}.${{ github.run_attempt }}

    steps:
      # - name: Install packages
      #   run: |
      #     apk update
      #     apk add git openssh-client rsync

      # - name: Setup ssh
      #   run: |
      #     umask 077
      #     mkdir -p /root/.ssh
      #     echo '${{ secrets.PSGPAC_SSH_KEY }}' > /root/.ssh/id_ed25519
      #     echo '${{ env.SSH_HOST }} ${{ secrets.SSH_HOST_KEY }}' >> /root/.ssh/known_hosts
      #     echo ServerAliveInterval 30 >> /root/.ssh/config
      #     echo User psgpac >> /root/.ssh/config

      - name: Create workdir
        id: workdir
        run: |
          ssh "$SSH_HOST" "mkdir -pv $WORKDIR"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy inputs
        run: |
          rsync -rl --exclude=.git "$GITHUB_WORKSPACE"/. "$SSH_HOST":"$WORKDIR"
      
      - name: Check if hw/** files changed
        id: check_hw
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^src/hw/'; then
            echo "run_hw=true" >> $GITHUB_OUTPUT
          else
            echo "run_hw=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Skip if no hw/ changes
        if: steps.check_hw.outputs.run_hw == 'false'
        run: echo "No changes in hw/, skipping HW checks."

      - name: Build synth
        if: steps.check_hw.outputs.run_hw == 'true'
        run: |
          ssh -t "$SSH_HOST" << 'EOF'
          cd ${{ env.WORKDIR }}/src/hw/synth
          arc shell acds/25.3 -- 'make synth'
          if grep "Synthesis Status : Successful" ${{env.WORKDIR}}/src/hw/synth/output_files/top.syn.summary ; then
              echo "--- make synth PASSED ---"
          else
              echo "--- make synth FAILED  ---"
              exit 1
          fi
          EOF

      - name: Purge workdir
        if: always()
        run: |
          ssh "$SSH_HOST" "rm -rf $WORKDIR"

  verification:
    needs: build_synth
    uses: ./.github/workflows/verification.yml
    with:
      run_hw: ${{ needs.build_synth.outputs.changes_detected }}
    secrets:
      PSGPAC_SSH_KEY: ${{ secrets.PSGPAC_SSH_KEY }}
      SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
