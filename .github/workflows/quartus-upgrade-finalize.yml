name: Quartus Upgrade Finalize

on:
  workflow_call:
    inputs:
      quartus_version:
        description: "Short or full Quartus version string"
        required: true
        type: string
      quartus_branch:
        description: "Upgrade branch (empty if none)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "If true, never open a PR"
        required: false
        type: boolean
        default: false
      upgrade_result:
        required: true
        type: string
      hardware_result:
        required: true
        type: string
      software_result:
        required: true
        type: string
      regression_result:
        required: true
        type: string
      nfs_relpath:
        description: "Optional override; otherwise read from ci/sed-config.yml"
        required: false
        type: string
        default: ""
    secrets:
      PAT:
        required: true

jobs:
  finalize:
    runs-on: [self-hosted, psgpac]
    env:
      NFS_ROOT: /nfs/site/disks/pac_release_1/github/psgpac/sed/quartus_upgrade

    steps:
      - name: Checkout caller SED
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Load config and engine scripts
        run: |
          set -euo pipefail
          ENGINE_REPO=https://github.com/altera-innersource/applications.fpga.system-example-designs.test-automation.git
          # Local workflow copy: clone engine scripts from test-automation main.
          ENGINE_REF=main
          rm -rf "$RUNNER_TEMP/quartus_upgrade_engine"
          if ! git clone --depth 1 -b "$ENGINE_REF" "$ENGINE_REPO" "$RUNNER_TEMP/quartus_upgrade_engine"; then
            echo "::warning::Clone of engine @$ENGINE_REF failed; falling back to default branch"
            git clone --depth 1 "$ENGINE_REPO" "$RUNNER_TEMP/quartus_upgrade_engine"
          fi
          echo "ENGINE_SCRIPTS=$RUNNER_TEMP/quartus_upgrade_engine/scripts" >> "$GITHUB_ENV"
          if [ -f ci/sed-config.yml ]; then
            python3 "$RUNNER_TEMP/quartus_upgrade_engine/scripts/upgrade_script/parse_sed_config.py" \
              ci/sed-config.yml --github-env
          else
            echo "BASE_BRANCH=master" >> "$GITHUB_ENV"
            echo "SED_DESIGN=${{ github.event.repository.name }}" >> "$GITHUB_ENV"
            echo "NOTIFY_TO=" >> "$GITHUB_ENV"
            echo "NFS_RELPATH=${{ inputs.nfs_relpath }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ inputs.nfs_relpath }}" ]; then
            echo "NFS_RELPATH=${{ inputs.nfs_relpath }}" >> "$GITHUB_ENV"
          fi

      - name: Prepare status dir
        run: |
          set -euo pipefail
          WORKDIR="${NFS_ROOT}/${NFS_RELPATH}/${{ github.run_id }}.${{ github.run_attempt }}"
          mkdir -pv "$WORKDIR/status" "$WORKDIR/logging"
          echo "WORKDIR=$WORKDIR" >> "$GITHUB_ENV"
          echo "STATUS_DIR=$WORKDIR/status" >> "$GITHUB_ENV"
          echo "LOG_DIR=$WORKDIR/logging" >> "$GITHUB_ENV"

      - name: Download stage status artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: quartus-upgrade-status-*
          path: ${{ env.STATUS_DIR }}/artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Merge downloaded status files
        run: |
          set -euo pipefail
          if [ -d "$STATUS_DIR/artifacts" ]; then
            find "$STATUS_DIR/artifacts" -name '*.json' -exec cp -f {} "$STATUS_DIR"/ \;
          fi
          # Synthesize missing stages from workflow job results when JSON absent.
          # If a core job failed but a stale/wrong JSON says pass, overwrite it.
          synth() {
            local stage=$1 result=$2 mapped force=${3:-0}
            case "$result" in
              success) mapped=pass ;;
              failure|cancelled) mapped=fail ;;
              *) mapped=skipped ;;
            esac
            if [ ! -f "$STATUS_DIR/${stage}.json" ] || [ "$force" = "1" ]; then
              if [ -f "$STATUS_DIR/${stage}.json" ] && [ "$force" = "1" ]; then
                existing=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('result',''))" "$STATUS_DIR/${stage}.json" || true)
                if [ "$existing" = "$mapped" ]; then
                  return 0
                fi
                echo "Overwriting $stage status: json=$existing job=$result"
              fi
              python3 "$ENGINE_SCRIPTS/upgrade_script/write_stage_status.py" \
                --stage "$stage" --result "$mapped" \
                --out "$STATUS_DIR/${stage}.json" \
                --reason "inferred from job result=$result"
            fi
          }
          synth quartus_upgrade '${{ inputs.upgrade_result }}'
          # Force when HW job failed so always()-status cannot leave a false pass
          if [ '${{ inputs.hardware_result }}' = 'failure' ] || [ '${{ inputs.hardware_result }}' = 'cancelled' ]; then
            synth hardware_build '${{ inputs.hardware_result }}' 1
          else
            synth hardware_build '${{ inputs.hardware_result }}'
          fi
          synth software_build '${{ inputs.software_result }}'
          synth hw_regression '${{ inputs.regression_result }}'

      - name: Decide PR eligibility
        id: gate
        run: |
          set -euo pipefail
          DRY_RUN='${{ inputs.dry_run }}'
          stage_result() {
            python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['result'])" "$1"
          }
          # Core stages gate the PR. DRC/timing are advisory: still emailed
          # prominently, but must not block PR creation.
          ALL_GREEN=true
          for stage in quartus_upgrade hardware_build software_build hw_regression; do
            result=$(stage_result "$STATUS_DIR/${stage}.json")
            if [ "$result" != "pass" ]; then
              ALL_GREEN=false
              echo "Stage $stage=$result"
            fi
          done
          DRC_TIMING_OK=true
          for stage in drc_check timing_check; do
            if [ -f "$STATUS_DIR/${stage}.json" ]; then
              result=$(stage_result "$STATUS_DIR/${stage}.json")
              echo "Advisory stage $stage=$result"
              if [ "$result" != "pass" ]; then
                DRC_TIMING_OK=false
              fi
            fi
          done

          CREATE_PR=false
          if [ "$ALL_GREEN" = "true" ] && [ "$DRY_RUN" != "true" ] && [ -n "${{ inputs.quartus_branch }}" ]; then
            CREATE_PR=true
          fi
          echo "create_pr=$CREATE_PR" >> "$GITHUB_OUTPUT"
          echo "all_green=$ALL_GREEN" >> "$GITHUB_OUTPUT"
          echo "drc_timing_ok=$DRC_TIMING_OK" >> "$GITHUB_OUTPUT"
          echo "::notice::ALL_GREEN=$ALL_GREEN DRC_TIMING_OK=$DRC_TIMING_OK CREATE_PR=$CREATE_PR DRY_RUN=$DRY_RUN"

      - name: Create pull request
        id: pr
        if: steps.gate.outputs.create_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          BRANCH='${{ inputs.quartus_branch }}'
          TITLE="Auto-upgrade: Quartus ${{ inputs.quartus_version }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          stage_result() {
            local f=$1
            if [ -f "$f" ]; then
              python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['result'])" "$f"
            else
              echo "n/a"
            fi
          }
          BODY=$(cat <<EOF
          ## Summary
          Automated Quartus upgrade for \`${SED_DISPLAY_NAME:-$SED_DESIGN}\` to \`${{ inputs.quartus_version }}\`.

          ## Stage results
          | Stage | Result |
          |---|---|
          | quartus_upgrade | $(stage_result "$STATUS_DIR/quartus_upgrade.json") |
          | hardware_build | $(stage_result "$STATUS_DIR/hardware_build.json") |
          | drc_check (advisory) | $(stage_result "$STATUS_DIR/drc_check.json") |
          | timing_check (advisory) | $(stage_result "$STATUS_DIR/timing_check.json") |
          | software_build | $(stage_result "$STATUS_DIR/software_build.json") |
          | hw_regression | $(stage_result "$STATUS_DIR/hw_regression.json") |

          Actions run: $RUN_URL
          EOF
          )
          # Drop leading indentation so the PR body is clean Markdown
          BODY=$(printf '%s\n' "$BODY" | sed 's/^[[:space:]]*//')
          git remote set-url origin "https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git"
          PR_URL=$(gh pr create \
            --title "$TITLE" \
            --body "$BODY" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --repo "${{ github.repository }}" || true)
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr list --head "$BRANCH" --repo "${{ github.repository }}" --json url -q '.[0].url' || true)
          fi
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "PR_URL=${PR_URL}" >> "$GITHUB_ENV"
          echo "::notice::PR $PR_URL"

      - name: Send upgrade email
        if: always()
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DRY_FLAG=()
          if [ '${{ inputs.dry_run }}' = 'true' ]; then
            DRY_FLAG=(--dry-run)
          fi
          DISPLAY_NAME="${SED_DISPLAY_NAME:-${SED_DESIGN:-${{ github.repository }}}}"
          SPETC_URL=""
          REGRESSION_CSV=""
          for dir in \
            /nfs/site/disks/pac_release_1/github/psgpac/sed/quartus_upgrade/build/${NFS_RELPATH:-ethernet/agx5/sm72/mdk/1x10g}/latest/reports \
            "$LOG_DIR"
          do
            [ -d "$dir" ] || continue
            csv=$(ls -1t "$dir"/SED_*.csv 2>/dev/null | head -1 || true)
            [ -n "$csv" ] || continue
            REGRESSION_CSV="$csv"
            spetc_id=$(python3 -c "import re,sys; t=open(sys.argv[1]).read(); m=re.search(r'SPeTC_Id,([0-9]+)', t); print(m.group(1) if m else '')" "$csv")
            if [ -n "$spetc_id" ]; then
              SPETC_URL="https://spetc.altera.com/testsummary?testRunIds=${spetc_id}"
            fi
            break
          done
          CSV_ARGS=()
          if [ -n "$REGRESSION_CSV" ]; then
            CSV_ARGS=(--regression-csv "$REGRESSION_CSV")
          fi
          UPGRADE_BRANCH='${{ inputs.quartus_branch }}'
          BRANCH_ARGS=()
          if [ -n "$UPGRADE_BRANCH" ]; then
            BRANCH_URL="${{ github.server_url }}/${{ github.repository }}/tree/${UPGRADE_BRANCH}"
            BRANCH_ARGS=(--upgrade-branch "$UPGRADE_BRANCH" --branch-url "$BRANCH_URL")
          fi
          python3 "$ENGINE_SCRIPTS/report/quartus_upgrade_mail.py" \
            --sed-name "$DISPLAY_NAME" \
            --quartus-version '${{ inputs.quartus_version }}' \
            --run-url "$RUN_URL" \
            --nfs-log "$LOG_DIR" \
            --status-dir "$STATUS_DIR" \
            --notify-to "${NOTIFY_TO:-}" \
            --pr-url "${PR_URL:-${{ steps.pr.outputs.pr_url }}}" \
            --spetc-url "$SPETC_URL" \
            "${BRANCH_ARGS[@]}" \
            "${CSV_ARGS[@]}" \
            --html-out "$LOG_DIR/upgrade_email.html" \
            "${DRY_FLAG[@]}"
