name: Quartus Upgrade IP

on:
  workflow_call:
    inputs:
      quartus_version:
        description: "Quartus ARC resource (Ex: acds/26.2)"
        required: true
        type: string
    secrets:
      PAT:
        required: true
    outputs:
      quartus_branch:
        description: "Pushed upgrade branch"
        value: ${{ jobs.upgrade_ip.outputs.quartus_branch }}
      quartus_version:
        description: "Short Quartus version (without acds/ prefix)"
        value: ${{ jobs.upgrade_ip.outputs.quartus_version }}
      run_jobs:
        description: "true if later HW/SW/regression should run"
        value: ${{ jobs.upgrade_ip.outputs.run_jobs }}

jobs:
  upgrade_ip:
    runs-on: [self-hosted, psgpac]
    outputs:
      quartus_branch: ${{ steps.upgrade.outputs.quartus_branch }}
      quartus_version: ${{ steps.version.outputs.VERSION }}
      run_jobs: ${{ steps.upgrade.outputs.run_jobs }}
    env:
      NFS_ROOT: /nfs/site/disks/pac_release_1/github/psgpac/sed/quartus_upgrade

    steps:
      - name: Validate Quartus version
        id: version
        run: |
          set -euo pipefail
          QUARTUS_VERSION=$(echo '${{ inputs.quartus_version }}' | xargs)
          if ! echo "$QUARTUS_VERSION" | grep -Eq '^(acds|acdskit)/[0-9]{2,}(\.[0-9]+)+$'; then
            echo "::error title=INVALID INPUT:: Invalid quartus version - $QUARTUS_VERSION"
            exit 1
          fi
          VERSION="${QUARTUS_VERSION#*/}"
          echo "QUARTUS_VERSION=$QUARTUS_VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice title=VALID INPUT:: $QUARTUS_VERSION"

      - name: Checkout caller SED
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Load ci/sed-config.yml and engine scripts
        run: |
          set -euo pipefail
          if [ ! -f ci/sed-config.yml ]; then
            echo "::error::Missing ci/sed-config.yml in caller repository"
            exit 1
          fi
          ENGINE_REPO=https://github.com/altera-innersource/applications.fpga.system-example-designs.test-automation.git
          # Local workflow copy: clone engine scripts from test-automation main.
          ENGINE_REF=main
          rm -rf "$RUNNER_TEMP/quartus_upgrade_engine"
          if ! git clone --depth 1 -b "$ENGINE_REF" "$ENGINE_REPO" "$RUNNER_TEMP/quartus_upgrade_engine"; then
            echo "::warning::Clone of engine @$ENGINE_REF failed; falling back to default branch"
            git clone --depth 1 "$ENGINE_REPO" "$RUNNER_TEMP/quartus_upgrade_engine"
          fi
          echo "ENGINE_SCRIPTS=$RUNNER_TEMP/quartus_upgrade_engine/scripts" >> "$GITHUB_ENV"
          python3 "$RUNNER_TEMP/quartus_upgrade_engine/scripts/upgrade_script/parse_sed_config.py" \
            ci/sed-config.yml --github-env

      - name: Setup NFS workdir
        run: |
          set -euo pipefail
          WORKDIR="${NFS_ROOT}/${NFS_RELPATH}/${{ github.run_id }}.${{ github.run_attempt }}"
          mkdir -pv "$WORKDIR/logging" "$WORKDIR/status"
          echo "WORKDIR=$WORKDIR" >> "$GITHUB_ENV"
          echo "STATUS_DIR=$WORKDIR/status" >> "$GITHUB_ENV"
          echo "LOG_DIR=$WORKDIR/logging" >> "$GITHUB_ENV"
          echo "${{ github.run_id }}" > "$WORKDIR/logging/run_id"

      - name: Configure git auth for push
        run: |
          set -euo pipefail
          git config user.name "psgpac-bot"
          git config user.email "psgpac-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git"
          # Fetch PR base only — do NOT reset to BASE_BRANCH. Stay on the
          # workflow dispatch ref so feature-branch RTL/Qsys changes are included
          # in the auto-upgrade branch that HW/SW build.
          git fetch origin "$BASE_BRANCH"
          echo "::notice::Upgrade starting from $(git rev-parse --short HEAD) ($(git branch --show-current)); PR base stays ${BASE_BRANCH}"

      - name: Apply version_files pins
        run: |
          set -euo pipefail
          for f in $VERSION_FILES; do
            [ -f "$f" ] || { echo "::error::version_files entry missing: $f"; exit 1; }
            if grep -q '^[[:space:]]*QUARTUS_VERSION=' "$f"; then
              sed -i "s|^[[:space:]]*QUARTUS_VERSION=.*|QUARTUS_VERSION=$QUARTUS_VERSION|" "$f"
            fi
            if grep -q '^[[:space:]]*export QUARTUS_VER=' "$f"; then
              sed -i "s|^[[:space:]]*export QUARTUS_VER=.*|export QUARTUS_VER=\"$QUARTUS_VERSION\"|" "$f"
            fi
            echo "Updated $f"
          done

      - name: Run IP upgrade (no compile, no PR)
        id: upgrade
        run: |
          set -euo pipefail
          START_TS=$(date +%s)
          fmt_dur() {
            local s=$1
            printf "%02d:%02d:%02d" $((s / 3600)) $(((s % 3600) / 60)) $((s % 60))
          }
          OUT_FILE="$LOG_DIR/upgrade_outputs.txt"
          : > "$OUT_FILE"
          # Colon-separated so `env KEY=val cmd` does not treat path tokens as the command
          EXTRA_COMMIT_PATHS=$(echo "$VERSION_FILES" | tr ' ' ':')

          # Mirror checkout + engine scripts onto NFS so the ARC compute node can see them
          mkdir -pv "$WORKDIR/sed_repo"
          rsync -a "$GITHUB_WORKSPACE"/ "$WORKDIR/sed_repo"/
          rm -rf "$WORKDIR/engine_upgrade_script"
          cp -a "$ENGINE_SCRIPTS/upgrade_script" "$WORKDIR/engine_upgrade_script"
          chmod +x "$WORKDIR/engine_upgrade_script/auto_upgrade.sh"

          # Wrapper matches historic scripts/quartus_upgrade.sh: arc submit → arc shell
          # Keep content indented for YAML | blocks; strip when writing the script.
          cat > "$WORKDIR/run_ip_upgrade.sh" <<'EOF'
          #!/bin/sh
          set -ex
          echo "QUARTUS_VERSION=$QUARTUS_VERSION"
          echo "ENGINE_UPGRADE=$ENGINE_UPGRADE"
          echo "QPF_PATH=$QPF_PATH"
          command -v arc
          # Do not inherit a workstation DISPLAY into ARC (breaks headless qsys-script)
          unset DISPLAY WAYLAND_DISPLAY
          arc shell "$QUARTUS_VERSION" -- "$ENGINE_UPGRADE" "$QPF_PATH" "$QUARTUS_REVISION"
          EOF
          sed -i 's/^          //' "$WORKDIR/run_ip_upgrade.sh"
          chmod +x "$WORKDIR/run_ip_upgrade.sh"

          set +e
          arc submit --watch -I ostype/suse15 ncpus=4 mem=48G priority=99 timeout=4h \
            iwd="$WORKDIR/sed_repo" -- \
            env http_proxy="$http_proxy" https_proxy="$https_proxy" \
            GH_TOKEN='${{ secrets.PAT }}' \
            BASE_BRANCH="$BASE_BRANCH" \
            QUARTUS_VERSION="$QUARTUS_VERSION" \
            DESIGN_ROOT="${DESIGN_ROOT:-}" \
            SKIP_SOURCE_UPGRADE="${SKIP_SOURCE_UPGRADE:-0}" \
            SKIP_COMPILE=1 \
            SKIP_PR=1 \
            EXTRA_COMMIT_PATHS="$EXTRA_COMMIT_PATHS" \
            GITHUB_OUTPUT="$OUT_FILE" \
            UPGRADE_LOG_DIR="$LOG_DIR/auto_upgrade" \
            QPF_PATH="$WORKDIR/sed_repo/${QUARTUS_QPF}" \
            QUARTUS_REVISION="$QUARTUS_REVISION" \
            ENGINE_UPGRADE="$WORKDIR/engine_upgrade_script/auto_upgrade.sh" \
            "$WORKDIR/run_ip_upgrade.sh" \
            2>&1 | tee "$LOG_DIR/quartus_update.log"
          rc=${PIPESTATUS[0]}
          set -e

          DUR=$(fmt_dur $(( $(date +%s) - START_TS )))

          BRANCH=""
          RUN_JOBS=false
          if [ -f "$OUT_FILE" ]; then
            BRANCH=$(grep -E '^quartus_branch=' "$OUT_FILE" | tail -1 | cut -d= -f2- || true)
            RUN_JOBS=$(grep -E '^run_jobs=' "$OUT_FILE" | tail -1 | cut -d= -f2- || echo false)
          fi
          if [ -z "$BRANCH" ]; then
            BRANCH=$(grep -E '^BRANCH_NAME=' "$LOG_DIR/quartus_update.log" | tail -1 | cut -d= -f2- || true)
          fi
          if grep -qE '^run_jobs=true$' "$OUT_FILE" "$LOG_DIR/quartus_update.log" 2>/dev/null; then
            RUN_JOBS=true
          fi

          if [ $rc -ne 0 ]; then
            python3 "$ENGINE_SCRIPTS/upgrade_script/write_stage_status.py" \
              --stage quartus_upgrade --result fail \
              --out "$STATUS_DIR/quartus_upgrade.json" \
              --log "$LOG_DIR/quartus_update.log" \
              --duration "$DUR" \
              --reason "auto_upgrade.sh exited $rc"
            echo "quartus_branch=" >> "$GITHUB_OUTPUT"
            echo "run_jobs=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          RESULT=pass
          REASON_ARGS=()
          if [ "$RUN_JOBS" != "true" ]; then
            RESULT=skipped
            REASON_ARGS=(--reason "no IP/version changes to commit")
          fi
          python3 "$ENGINE_SCRIPTS/upgrade_script/write_stage_status.py" \
            --stage quartus_upgrade --result "$RESULT" \
            --out "$STATUS_DIR/quartus_upgrade.json" \
            --log "$LOG_DIR/quartus_update.log" \
            --duration "$DUR" \
            "${REASON_ARGS[@]}"

          echo "quartus_branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "run_jobs=${RUN_JOBS}" >> "$GITHUB_OUTPUT"
          echo "::notice::branch=${BRANCH} run_jobs=${RUN_JOBS} duration=${DUR}"


      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-upgrade-status-upgrade
          path: ${{ env.STATUS_DIR }}
          if-no-files-found: warn
