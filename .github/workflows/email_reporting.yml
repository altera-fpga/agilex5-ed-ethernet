name: Email report
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      triggered_by_schedule:
        type: boolean
        required: false
        default: false
      triggered_by_tag_push:
        type: boolean
        required: false
        default: false
      release_tag:
        type: string
        required: false
        default: ""
      triggered_by_quartus_upgrade:
        type: boolean
        required: false
        default: false
      quartus_version:
        required: false
        type: string
      # Defaults preserve modular Ethernet 1x10G (build_hw_sw.yml).
      # PTP-10G passes 1588ptp / agx5-sm72-pdk / 2x10g.
      sed_design:
        type: string
        required: false
        default: "ethernet"
      sed_devkit:
        type: string
        required: false
        default: "agx5-sm72-mdk"
      sed_config:
        type: string
        required: false
        default: "1x10g"


jobs:
  reporting:
    runs-on: [self-hosted, psgpac]
    env:
      WORKDIR: /nfs/site/disks/pac_release_1/github/psgpac/${{ github.repository }}/${{ github.run_id }}.${{ github.run_attempt }}
      REPO: https://github.com/altera-innersource/applications.fpga.system-example-designs.test-automation.git
      SED_REGRESSION_PATH: /nfs/site/disks/pac_release_1/github/psgpac/sed/regression_test/tests/scripts/ethernet
      SED_DESIGN: ${{ inputs.sed_design || 'ethernet' }}
      SED_DEVKIT: ${{ inputs.sed_devkit || 'agx5-sm72-mdk' }}
      SED_CONFIG: ${{ inputs.sed_config || '1x10g' }}
    steps:
      - name: Create workdir
        run: |
          mkdir -pv $WORKDIR;cd $WORKDIR
          git clone ${{ env.REPO }} automation_repo

      # - name: sending reports of nighlty/release
      #   if: ${{ inputs.triggered_by_schedule || inputs.triggered_by_tag_push }}
      #   run: |
      #     cd ${{env.SED_REGRESSION_PATH}} && \
      #     python3 sed_ethernet_agx5_sm72_modular_1x10g_report.py

      - name: sending reports of quartus_upgrade/Nightly/release
        run: |
          cd ${{env.WORKDIR}}/automation_repo/scripts/report
          echo "Email report for design=${SED_DESIGN} devkit=${SED_DEVKIT} config=${SED_CONFIG}"
          if [[ ${{ inputs.triggered_by_schedule }} == "true" ]]; then
            python3 sed_test_report.py --param-sed-design=${SED_DESIGN} --param-sed-devkit=${SED_DEVKIT} --param-sed-config=${SED_CONFIG} --param-build-type=nightly --param-build-id=latest
          elif [[ ${{ inputs.triggered_by_tag_push }} == "true" ]]; then
            python3 sed_test_report.py --param-sed-design=${SED_DESIGN} --param-sed-devkit=${SED_DEVKIT} --param-sed-config=${SED_CONFIG} --param-build-type=release --param-build-id=${{ inputs.release_tag }}
          elif [[ ${{ inputs.triggered_by_quartus_upgrade }} == "true" ]]; then
            python3 sed_test_report.py --param-sed-design=${SED_DESIGN} --param-sed-devkit=${SED_DEVKIT} --param-sed-config=${SED_CONFIG} --param-build-type=quartus --param-build-id=latest --param-quart-ver=${{ inputs.quartus_version }}
          fi

      - name: Purge workdir
        if: always()
        run: |
          rm -rf $WORKDIR
