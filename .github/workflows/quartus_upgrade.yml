name: Quartus Upgrade
on:
  workflow_dispatch:
    inputs:
      Quartus_version:
        description: 'Quartus resource (Ex: acds/26.2)'
        required: true
        type: string
      dry_run:
        description: 'If true, run full path but do not open a PR'
        type: boolean
        default: false

jobs:
  # Local copies until test-automation enables org reusable-workflow access.
  # Scripts are cloned from test-automation@main.
  upgrade:
    uses: ./.github/workflows/quartus-upgrade-ip.yml
    with:
      quartus_version: ${{ inputs.Quartus_version }}
    secrets:
      PAT: ${{ secrets.PAT }}

  build_hardware:
    if: always() && needs.upgrade.outputs.run_jobs == 'true'
    needs: upgrade
    uses: ./.github/workflows/build_hardware.yml
    with:
      triggered_by_quartus_upgrade: true
      quartus_upgrade_branch: ${{ needs.upgrade.outputs.quartus_branch }}

  build_software:
    if: always() && needs.upgrade.outputs.run_jobs == 'true' && needs.build_hardware.result == 'success'
    needs: [upgrade, build_hardware]
    uses: ./.github/workflows/build_software.yml
    with:
      triggered_by_quartus_upgrade: true
      quartus_upgrade_branch: ${{ needs.upgrade.outputs.quartus_branch }}

  regression_test:
    if: always() && needs.upgrade.outputs.run_jobs == 'true' && needs.build_software.result == 'success'
    needs: [upgrade, build_hardware, build_software]
    uses: ./.github/workflows/test_execution.yml
    with:
      triggered_by_quartus_upgrade: true

  finalize:
    if: always()
    needs: [upgrade, build_hardware, build_software, regression_test]
    uses: ./.github/workflows/quartus-upgrade-finalize.yml
    with:
      quartus_version: ${{ needs.upgrade.outputs.quartus_version }}
      quartus_branch: ${{ needs.upgrade.outputs.quartus_branch }}
      dry_run: ${{ inputs.dry_run }}
      upgrade_result: ${{ needs.upgrade.result }}
      hardware_result: ${{ needs.build_hardware.result }}
      software_result: ${{ needs.build_software.result }}
      regression_result: ${{ needs.regression_test.result }}
    secrets:
      PAT: ${{ secrets.PAT }}
