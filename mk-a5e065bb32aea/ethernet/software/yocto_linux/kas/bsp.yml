header:
  version: 17

local_conf_header:
  bsp: |
    PREFERRED_PROVIDER_virtual/kernel = "linux-socfpga-lts"
    PREFERRED_VERSION_linux-socfpga-lts = "6.18.37%"
    KBRANCH = "socfpga-6.18.37-lts"
    LINUX_SRCREV = "SED-Ethernet-PTP-Agilex5-Quartus-26.3-Rel-D1.1"
    PREFERRED_PROVIDER_virtual/bootloader = "u-boot-socfpga"
    PREFERRED_VERSION_u-boot-socfpga = "v2026.01%%"
    UBOOT_REPO = "git://github.com/altera-innersource/applications.fpga.soc.uboot-socfpga-dev.git"
    UBOOT_BRANCH = "socfpga_v2026.01"
    UBOOT_SRCREV = "${AUTOREV}"
    PREFERRED_VERSION_arm-trusted-firmware = "v2.14%"
    ATF_REPO = "git://github.com/altera-innersource/applications.fpga.soc.arm-trusted-firmware-dev.git"
    ATF_BRANCH = "socfpga_v2.14.0"
    ATF_SRCREV = "${AUTOREV}"
